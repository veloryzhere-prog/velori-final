  "paths": {
    "/health": {
      "get": {
        "operationId": "getServiceHealth",
        "summary": "Read current service configuration health",
        "description": "Returns nonsecret readiness booleans from the existing Edge Function. This is not a synthetic uptime/SLA monitor.",
        "security": [],
        "responses": {
          "200": {
            "description": "Current function health; configured may be false even when status is ok.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "status",
                    "configured",
                    "originsConfigured",
                    "setupCodeEnabled",
                    "mediaCleanupConfigured"
                  ],
                  "properties": {
                    "status": {
                      "const": "ok"
                    },
                    "configured": {
                      "type": "boolean"
                    },
                    "originsConfigured": {
                      "type": "boolean"
                    },
                    "setupCodeEnabled": {
                      "type": "boolean"
                    },
                    "mediaCleanupConfigured": {
                      "type": "boolean"
                    }
                  },
                  "additionalProperties": false
                }
              }
            }
          }
        }
      }
    }
  },
