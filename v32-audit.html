<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>VELORI V32 internal responsive audit</title><style>body{margin:0;background:#08060c;color:#fff;font:14px system-ui}header{display:flex;gap:12px;flex-wrap:wrap;padding:12px;position:sticky;top:0;background:#191021;z-index:2;align-items:center}select,button{font:inherit;padding:8px;border-radius:8px}main{display:flex;justify-content:center;padding:16px;overflow:auto}iframe{background:#fff;border:1px solid #795786;flex:none}output{font-size:12px}</style></head><body><header><strong>V32 internal QA</strong><label>Viewport <select id="size"><option>320x640</option><option>360x800</option><option selected>390x844</option><option>412x915</option><option>768x1024</option><option>1024x768</option><option>1440x900</option></select></label><label>Screen <select id="screen"><option value="/">Public app</option><option value="/login">Login</option><option value="/signup">Register</option><option value="/forge">FORGE</option><option value="/admin">Admin</option><option value="/v32-components.html?screen=home">Feed component · live public data</option><option value="/v32-components.html?screen=explore">Explore component · live public data</option><option value="/v32-components.html?screen=post">Post Studio component · local test draft</option><option value="/v32-components.html?screen=reel">Reel Studio component · local test draft</option><option value="/v32-components.html?screen=music">Music picker · live published catalog</option><option value="/v32-components.html?screen=render">Story renderer · precision fixture</option></select></label><label>Route <input id="custom-route" type="text" value="/" aria-label="Internal QA route"></label><button id="open-route">Open route</button><button id="theme">Dark</button><button id="measure">Measure layout</button><output id="result"></output></header><main><iframe id="app" title="VELORI responsive inspection"></iframe></main><script type="module">
const frame=document.querySelector('iframe'), size=document.querySelector('#size'), screen=document.querySelector('#screen'), result=document.querySelector('#result');let dark=true;
function measure(){try{const doc=frame.contentDocument;result.textContent=JSON.stringify({screen:screen.value,width:doc.documentElement.clientWidth,scrollWidth:doc.documentElement.scrollWidth,theme:doc.documentElement.dataset.theme,canvas:doc.querySelector('canvas')?.getAttribute('data-result')});}catch{result.textContent='Frame unavailable';}}
function theme(){const doc=frame.contentDocument;if(doc)doc.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('#theme').textContent=dark?'Switch to light':'Switch to dark';}
function resize(){const[w,h]=size.value.split('x');frame.width=w;frame.height=h;}
function open(){frame.src=screen.value;resize();}frame.onload=()=>{theme();measure();};size.onchange=()=>{resize();measure();};screen.onchange=open;document.querySelector('#theme').onclick=()=>{dark=!dark;theme();measure();};document.querySelector('#measure').onclick=measure;document.querySelector('#open-route').onclick=()=>{const path=document.querySelector('#custom-route').value;if(path.startsWith('/')&&!path.startsWith('//')){frame.src=path;resize();}};open();
</script></body></html>
